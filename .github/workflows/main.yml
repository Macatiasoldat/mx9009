name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target Jovian8_VST3 Sampler16_VST3 --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-VST3
          path: build/*_artefacts/Release/VST3/

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Xcode
      - name: Build AU + VST3
        run: cmake --build build --config Release --target Jovian8_AU Jovian8_VST3 Sampler16_AU Sampler16_VST3 --parallel
      - name: Signature ad hoc et archives
        run: |
          mkdir out
          for f in build/*_artefacts/Release/AU/*.component build/*_artefacts/Release/VST3/*.vst3; do
            codesign --force --deep --sign - "$f"
            ditto -c -k --keepParent "$f" "out/$(basename "$f").zip"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-AU-VST3
          path: out/

cmake_minimum_required(VERSION 3.22)
# macOS : binaire universel (Apple Silicon M1 + Intel), compatible macOS 11+
set(CMAKE_OSX_ARCHITECTURES "arm64;x86_64" CACHE STRING "")
set(CMAKE_OSX_DEPLOYMENT_TARGET "11.0" CACHE STRING "")

project(Jovian8 VERSION 1.0.0)

set(CMAKE_CXX_STANDARD 17)
set(CMAKE_CXX_STANDARD_REQUIRED ON)

# Runtime Visual C++ lié statiquement : pas besoin d'installer de redistribuable sur la machine de musique
set(CMAKE_MSVC_RUNTIME_LIBRARY "MultiThreaded$<$<CONFIG:Debug>:Debug>")

include(FetchContent)
FetchContent_Declare(JUCE
    GIT_REPOSITORY https://github.com/juce-framework/JUCE.git
    GIT_TAG 8.0.4
    GIT_SHALLOW ON)
FetchContent_MakeAvailable(JUCE)

if(APPLE)
    set(JOVIAN_FORMATS VST3 AU Standalone)   # AU = format lu par GarageBand / Logic
else()
    set(JOVIAN_FORMATS VST3 Standalone)
endif()

juce_add_plugin(Jovian8
    COMPANY_NAME "KoalaAudio"
    PLUGIN_MANUFACTURER_CODE Koal
    PLUGIN_CODE Jov8
    FORMATS ${JOVIAN_FORMATS}
    PRODUCT_NAME "Jovian8"
    IS_SYNTH TRUE
    NEEDS_MIDI_INPUT TRUE
    NEEDS_MIDI_OUTPUT FALSE
    VST3_CATEGORIES Instrument Synth
    COPY_PLUGIN_AFTER_BUILD FALSE)

target_sources(Jovian8 PRIVATE
    Source/PluginProcessor.cpp
    Source/PluginEditor.cpp)

target_compile_definitions(Jovian8 PUBLIC
    JUCE_WEB_BROWSER=0
    JUCE_USE_CURL=0
    JUCE_VST3_CAN_REPLACE_VST2=0)

target_link_libraries(Jovian8
    PRIVATE
        juce::juce_audio_utils
        juce::juce_dsp
    PUBLIC
        juce::juce_recommended_config_flags
        juce::juce_recommended_lto_flags
        juce::juce_recommended_warning_flags)

# ---------------------------------------------------------------- Sampler16 (sampler 16 pads + séquenceur)
juce_add_plugin(Sampler16
    COMPANY_NAME "KoalaAudio"
    PLUGIN_MANUFACTURER_CODE Koal
    PLUGIN_CODE Smp6
    FORMATS ${JOVIAN_FORMATS}
    PRODUCT_NAME "Sampler16"
    IS_SYNTH TRUE
    NEEDS_MIDI_INPUT TRUE
    NEEDS_MIDI_OUTPUT FALSE
    VST3_CATEGORIES Instrument Sampler
    COPY_PLUGIN_AFTER_BUILD FALSE)

target_sources(Sampler16 PRIVATE
    Sampler/Source/SamplerProcessor.cpp
    Sampler/Source/SamplerEditor.cpp)

target_compile_definitions(Sampler16 PUBLIC
    JUCE_WEB_BROWSER=0
    JUCE_USE_CURL=0
    JUCE_VST3_CAN_REPLACE_VST2=0
    JUCE_USE_MP3AUDIOFORMAT=1)

target_link_libraries(Sampler16
    PRIVATE
        juce::juce_audio_utils
        juce::juce_audio_formats
        juce::juce_dsp
    PUBLIC
        juce::juce_recommended_config_flags
        juce::juce_recommended_lto_flags
        juce::juce_recommended_warning_flags)

# Jovian 8 — synthé VST3 (Windows 10 / Cubase 9.5)

Synthé polyphonique analogique virtuel 8 voix, inspiré de l'architecture des grands synthés polyphoniques des années 80.
Créé avec JUCE 8 (C++), format **VST3 64 bits**.

## Fonctions
- 8 voix, modes **Poly / Unison / Mono**, glide, pédale de sustain, pitch bend, molette de modulation
- 2 VCO (Tri / Saw / Pulse / Carré, 16'–2'), **sync**, **cross-mod**, PWM par LFO, bruit
- HPF + VCF résonant **12 dB / 24 dB**, suivi de clavier, enveloppe et LFO vers le filtre
- 2 enveloppes ADSR (filtre et ampli), LFO (Tri / Saw / Carré / S&H) avec retard
- Chorus I / II, largeur stéréo
- **Arpégiateur** : Up, Down, Up/Down, Random, Played, 1–4 octaves, Hold, Gate, rythmes 1/4 → 1/32 (+ triolets), synchronisé au tempo de Cubase
- 21 presets : cuivres, cordes, nappes, basses, leads, cloches, arpèges, piano, orgue, effets

## Obtenir le fichier .vst3 (sans rien installer : GitHub Actions)
1. Créez un dépôt GitHub (gratuit) et envoyez-y tout ce dossier (y compris `.github`).
2. Onglet **Actions** → « Build VST3 (Windows) » → attendez ~10 min.
3. Téléchargez l'artefact **Jovian8-VST3-Windows-x64** et décompressez-le.

## Ou compiler sur votre PC
Prérequis : Visual Studio 2022 (charge de travail « Développement Desktop en C++ »), CMake, Git.
```
cmake -B build -G "Visual Studio 17 2022" -A x64
cmake --build build --config Release --target Jovian8_VST3
```
Résultat : `build\Jovian8_artefacts\Release\VST3\Jovian8.vst3`

## Installation dans Cubase 9.5
1. Copiez le dossier `Jovian8.vst3` dans `C:\Program Files\Common Files\VST3\` (droits administrateur).
2. Lancez Cubase → Studio → Configuration des plug-ins VST → Rescanner. Pensez à utiliser la version **64 bits** de Cubase.
3. Ajoutez une piste **Instrument** → Jovian8. L'arpégiateur s'active avec la case « Arp On » (presets « Arp … »).

## macOS (Mac mini M1) + GarageBand
GarageBand ne lit que le format **Audio Unit (AU)**. Le même workflow GitHub Actions construit aussi, sur un Mac Apple Silicon, un binaire universel (M1 + Intel) en AU et VST3.
1. Lancez le workflow, téléchargez l'artefact **Jovian8-macOS-AU-VST3**, décompressez `Jovian8-AU-macOS.zip`.
2. Retirez la quarantaine (plug-in non notarisé) : dans le Terminal, `xattr -dr com.apple.quarantine ~/Downloads/Jovian8.component`
3. Copiez `Jovian8.component` dans `~/Bibliothèque/Audio/Plug-Ins/Components/` (dossier Bibliothèque de votre session ; il faut l'afficher via Aller > Maintenir Option).
4. Quittez puis relancez GarageBand (il valide le plug-in au démarrage). Piste « Instrument logiciel » → réglages de la piste → Plug-ins → Instrument → **Audio Units → KoalaAudio → Jovian8**.
5. En cas de refus : `auval -v aumu Jov8 Koal` dans le Terminal donne la cause.

## Structure
- `Source/Params.h` : table unique des paramètres
- `Source/Engine.h` : moteur audio (C++ pur) · `Source/Arp.h` : arpégiateur · `Source/Presets.h` : presets
- `Source/PluginProcessor.*`, `Source/PluginEditor.*` : plug-in JUCE et interface
- `tests/render_test.cpp` : test hors-ligne (`g++ -std=c++17 -O2 tests/render_test.cpp`)

## Remarques
- Nom et son originaux : ce n'est ni un clone ni une copie des sons d'usine d'un produit existant ; les presets en recréent le *caractère*.
- JUCE est sous licence AGPLv3 / commerciale : usage personnel libre ; pour vendre le plug-in, il faut une licence JUCE ou publier le code source.

## Sampler16 (second plug-in du projet)
Sampler 16 pads, séquenceur de pas (8 patterns), pour vos propres sons — aucun son n'est fourni.
- Chargement : glisser-déposer un fichier (WAV, AIFF, MP3, FLAC, OGG) sur un pad ou sur la forme d'onde, ou bouton « Charger un son... »
- Par pad : volume, pan, hauteur, début/fin (poignées sur la forme d'onde), mode One-shot / Gate / Boucle, reverse, attack, release, filtre, résonance, choke (groupes)
- Mode clavier : le pad sélectionné se joue sur tout le clavier (note racine réglable)
- Séquenceur : 16 pas, longueur, 4 vitesses, swing, gate ; « Suit lecture » = suit le transport de l'hôte ; « Seq libre » = tourne seul
- Effets : drive, delay ping-pong, reverb
- MIDI : pads sur les notes 36 à 51 (C1 à D#2)
- Les chemins de vos fichiers sont enregistrés dans le projet : ne les déplacez pas après coup.
Artefacts : `Sampler16.component` (AU, GarageBand) et `Sampler16.vst3` (Cubase).

#pragma once
// Arpégiateur synchronisé au tempo de l'hôte (C++ pur).
#include "Engine.h"

namespace jv
{
struct ArpSettings
{
    int mode = 0;      // 0 Up, 1 Down, 2 Up/Down, 3 Random, 4 Played
    int rate = 3;      // 0 1/4, 1 1/8, 2 1/8T, 3 1/16, 4 1/16T, 5 1/32
    int octaves = 1;
    float gate = 0.5f;
    bool hold = false;
};

class Arpeggiator
{
public:
    Arpeggiator()
    {
        notes_.reserve (128);
        base_.reserve (128);
        seq_.reserve (128 * 4 + 8);
    }

    void prepare (double sampleRate) { sr_ = sampleRate; reset(); }

    void reset()
    {
        notes_.clear();
        counter_ = 0;
        sounding_ = -1;
        gateLeft_ = 0.0;
        nextStep_ = 0.0;
        holdWas_ = false;
    }

    // Consomme les événements de notes de `in` (triés par position) et produit les notes arpégées dans `out`.
    void process (const std::vector<Ev>& in, std::vector<Ev>& out, int n, const ArpSettings& s,
                  double bpm, bool hostPlaying, double ppq)
    {
        static const double beats[6] = { 1.0, 0.5, 1.0 / 3.0, 0.25, 1.0 / 6.0, 0.125 };
        bpm = std::min (400.0, std::max (20.0, bpm));
        const double spb = sr_ * 60.0 / bpm;
        const double stepBeats = beats[std::min (5, std::max (0, s.rate))];
        const double stepSamples = std::max (1.0, spb * stepBeats);

        if (holdWas_ && ! s.hold)
            notes_.erase (std::remove_if (notes_.begin(), notes_.end(), [] (const NoteInfo& x) { return ! x.down; }), notes_.end());
        holdWas_ = s.hold;

        size_t e = 0;
        for (int t = 0; t < n; ++t)
        {
            while (e < in.size() && in[e].pos <= t)
            {
                const Ev& ev = in[e++];
                if (ev.type == EV_NOTE_ON)
                {
                    bool anyDown = false;
                    for (auto& x : notes_) anyDown = anyDown || x.down;
                    if (s.hold && ! anyDown) notes_.clear();
                    const bool wasEmpty = notes_.empty();
                    bool found = false;
                    for (auto& x : notes_) if (x.note == ev.note) { x.down = true; x.vel = ev.value; found = true; }
                    if (! found) notes_.push_back ({ ev.note, ev.value, true });
                    if (wasEmpty)
                    {
                        counter_ = 0;
                        nextStep_ = 0.0;
                        if (hostPlaying && ppq >= 0.0)
                        {
                            const double pos = (ppq + t / spb) / stepBeats;
                            const double frac = pos - std::floor (pos);
                            nextStep_ = frac < 1e-3 ? 0.0 : (1.0 - frac) * stepSamples;
                        }
                    }
                }
                else if (ev.type == EV_NOTE_OFF)
                {
                    for (auto& x : notes_) if (x.note == ev.note) x.down = false;
                    if (! s.hold)
                        notes_.erase (std::remove_if (notes_.begin(), notes_.end(), [] (const NoteInfo& x) { return ! x.down; }), notes_.end());
                }
                else if (ev.type == EV_ALL_OFF)
                    notes_.clear();

                if (notes_.empty() && sounding_ >= 0)
                {
                    out.push_back ({ t, EV_NOTE_OFF, sounding_, 0.f });
                    sounding_ = -1;
                }
            }

            if (sounding_ >= 0)
            {
                if (gateLeft_ <= 0.0) { out.push_back ({ t, EV_NOTE_OFF, sounding_, 0.f }); sounding_ = -1; }
                else gateLeft_ -= 1.0;
            }

            if (! notes_.empty())
            {
                if (nextStep_ <= 0.0)
                {
                    fire (t, out, s, stepSamples);
                    nextStep_ += stepSamples;
                }
                nextStep_ -= 1.0;
            }
        }
    }

private:
    struct NoteInfo { int note; float vel; bool down; };
    struct SeqItem { int note; float vel; };

    uint32_t rnd()
    {
        rng_ ^= rng_ << 13; rng_ ^= rng_ >> 17; rng_ ^= rng_ << 5;
        return rng_;
    }

    void fire (int t, std::vector<Ev>& out, const ArpSettings& s, double stepSamples)
    {
        base_.clear();
        for (auto& x : notes_) base_.push_back ({ x.note, x.vel });
        if (s.mode != 4)
            std::sort (base_.begin(), base_.end(), [] (const SeqItem& a, const SeqItem& b) { return a.note < b.note; });

        seq_.clear();
        const int oct = std::min (4, std::max (1, s.octaves));
        for (int o = 0; o < oct; ++o)
            for (auto& b : base_)
                if (b.note + 12 * o <= 127) seq_.push_back ({ b.note + 12 * o, b.vel });
        if (seq_.empty()) return;

        if (s.mode == 1)
            std::reverse (seq_.begin(), seq_.end());
        else if (s.mode == 2 && seq_.size() > 2)
        {
            const size_t sz = seq_.size();
            for (size_t i = sz - 2; i >= 1; --i) { seq_.push_back (seq_[i]); if (i == 1) break; }
        }

        size_t idx;
        if (s.mode == 3) idx = rnd() % seq_.size();
        else idx = (size_t) (counter_++) % seq_.size();

        const SeqItem pick = seq_[idx];
        if (sounding_ >= 0) out.push_back ({ t, EV_NOTE_OFF, sounding_, 0.f });
        out.push_back ({ t, EV_NOTE_ON, pick.note, pick.vel });
        sounding_ = pick.note;
        gateLeft_ = std::max (1.0, (double) std::min (0.98f, std::max (0.05f, s.gate)) * stepSamples);
    }

    double sr_ = 44100.0, nextStep_ = 0.0, gateLeft_ = 0.0;
    int sounding_ = -1;
    uint64_t counter_ = 0;
    bool holdWas_ = false;
    uint32_t rng_ = 88172645u;
    std::vector<NoteInfo> notes_;
    std::vector<SeqItem> base_, seq_;
};
} // namespace jv

#pragma once
// Moteur de synthèse polyphonique 8 voix (C++ pur, sans JUCE).
// 2 VCO (PolyBLEP) + sync + cross-mod, bruit, HPF, VCF 12 dB (SVF) / 24 dB (échelle),
// 2 enveloppes ADSR, LFO, modes Poly / Unison / Mono, glide, pédale de sustain.
#include "Params.h"
#include <algorithm>
#include <cmath>
#include <cstdint>
#include <utility>
#include <vector>

namespace jv
{
constexpr float kPi = 3.14159265358979323846f;
constexpr int kVoices = 8;

enum EvType { EV_NOTE_ON, EV_NOTE_OFF, EV_ALL_OFF, EV_BEND, EV_MOD, EV_SUSTAIN };
struct Ev
{
    int pos;
    EvType type;
    int note;
    float value;
};

struct EnvSet { float a, d, s, r; };

struct Envelope
{
    enum Stage { Idle, Att, Dec, Sus, Rel };
    Stage st = Idle;
    float v = 0.f;

    float tick (const EnvSet& e, float sr)
    {
        switch (st)
        {
            case Att:
                v += 1.f / (std::max (e.a, 0.0005f) * sr);
                if (v >= 1.f) { v = 1.f; st = Dec; }
                break;
            case Dec:
            {
                const float c = std::exp (-4.6f / (std::max (e.d, 0.001f) * sr));
                v = e.s + (v - e.s) * c;
                if (std::fabs (v - e.s) < 1e-4f) { v = e.s; st = Sus; }
                break;
            }
            case Sus: v = e.s; break;
            case Rel:
                v *= std::exp (-4.6f / (std::max (e.r, 0.001f) * sr));
                if (v < 1e-4f) { v = 0.f; st = Idle; }
                break;
            default: break;
        }
        return v;
    }
};

struct Osc
{
    float phase = 0.f;
    bool wrapped = false;

    static float blep (float t, float dt)
    {
        if (t < dt) { t /= dt; return t + t - t * t - 1.f; }
        if (t > 1.f - dt) { t = (t - 1.f) / dt; return t * t + t + t + 1.f; }
        return 0.f;
    }

    // wave : 0 tri, 1 saw, 2 pulse (largeur pw), 3 carré
    float gen (int wave, float dt, float pw)
    {
        float out;
        if (wave == 0)
            out = 4.f * std::fabs (phase - 0.5f) - 1.f;
        else if (wave == 1)
            out = 2.f * phase - 1.f - blep (phase, dt);
        else
        {
            const float w = (wave == 3) ? 0.5f : pw;
            out = phase < w ? 1.f : -1.f;
            out += blep (phase, dt);
            float t2 = phase - w;
            if (t2 < 0.f) t2 += 1.f;
            out -= blep (t2, dt);
            out -= (2.f * w - 1.f); // retire la composante continue
        }
        phase += dt;
        wrapped = false;
        if (phase >= 1.f) { phase -= 1.f; wrapped = true; }
        return out;
    }
};

struct Svf
{
    float s1 = 0.f, s2 = 0.f;
    void reset() { s1 = s2 = 0.f; }
    float lp (float x, float g, float R)
    {
        const float hp = (x - (2.f * R + g) * s1 - s2) / (1.f + 2.f * R * g + g * g);
        const float bp = g * hp + s1;
        s1 = g * hp + bp;
        const float l = g * bp + s2;
        s2 = g * bp + l;
        return l;
    }
};

struct Ladder
{
    float z[4] = { 0, 0, 0, 0 };
    void reset() { z[0] = z[1] = z[2] = z[3] = 0.f; }
    float process (float x, float g, float k)
    {
        const float G = g / (1.f + g), G2 = G * G, G3 = G2 * G, G4 = G2 * G2, ig = 1.f / (1.f + g);
        const float S = (G3 * z[0] + G2 * z[1] + G * z[2] + z[3]) * ig;
        float y = (x - k * S) / (1.f + k * G4);
        for (int i = 0; i < 4; ++i)
        {
            const float v = (y - z[i]) * G;
            const float o = v + z[i];
            z[i] = o + v;
            y = o;
        }
        return y;
    }
};

class Engine
{
public:
    void prepare (double sampleRate, int maxBlock = 1024)
    {
        sr = (float) sampleRate;
        lfoBuf.assign ((size_t) std::max (16, maxBlock), 0.f);
        held.reserve (256);
        reset();
    }

    void reset()
    {
        for (auto& v : voices) v = Voice();
        held.clear();
        sustainDown = false;
        lastPitch = -1.f;
        lfoPhase = 0.f;
        bend = 0.f;
        modWheel = 0.f;
        ageCounter = 0;
    }

    void setParams (const Params& p) { P = p; }

    void handle (const Ev& e)
    {
        switch (e.type)
        {
            case EV_NOTE_ON:  noteOn (e.note, e.value); break;
            case EV_NOTE_OFF: noteOff (e.note); break;
            case EV_ALL_OFF:  allNotesOff(); break;
            case EV_BEND:     bend = e.value; break;
            case EV_MOD:      modWheel = e.value; break;
            case EV_SUSTAIN:  setSustain (e.value > 0.5f); break;
        }
    }

    void allNotesOff()
    {
        held.clear();
        for (auto& v : voices)
            if (v.gateOn) release (v);
    }

    void render (float* L, float* R, int n)
    {
        while (n > 0)
        {
            const int m = std::min (n, (int) lfoBuf.size());
            renderChunk (L, R, m);
            L += m; R += m; n -= m;
        }
    }

private:
    struct Voice
    {
        bool active = false, gateOn = false, pendingRelease = false;
        int note = 60;
        float vel = 1.f, pitch = 60.f, target = 60.f, detune = 0.f, lfoGain = 1.f, o2prev = 0.f, hpS = 0.f;
        uint32_t age = 0;
        Osc o1, o2;
        Envelope fe, ae;
        Ladder lad;
        Svf svf;
    };

    float rnd() // [0,1)
    {
        rng ^= rng << 13; rng ^= rng >> 17; rng ^= rng << 5;
        return (float) (rng & 0xFFFFFF) / 16777216.f;
    }

    void release (Voice& v)
    {
        v.gateOn = false;
        v.pendingRelease = false;
        if (v.fe.st != Envelope::Idle) v.fe.st = Envelope::Rel;
        if (v.ae.st != Envelope::Idle) v.ae.st = Envelope::Rel;
    }

    void trigger (Voice& v, int note, float vel, float detune)
    {
        const bool fresh = ! v.active || v.ae.st == Envelope::Idle;
        if (fresh)
        {
            v.lad.reset(); v.svf.reset(); v.hpS = 0.f; v.o2prev = 0.f;
            v.fe.v = 0.f; v.ae.v = 0.f;
            v.pitch = (P[P_GLIDE] > 0.001f && lastPitch >= 0.f) ? lastPitch : (float) note;
        }
        v.note = note; v.vel = vel; v.target = (float) note; v.detune = detune;
        v.gateOn = true; v.pendingRelease = false; v.active = true; v.age = ++ageCounter;
        v.fe.st = Envelope::Att; v.ae.st = Envelope::Att;
        v.lfoGain = P[P_LFODELAY] > 0.001f ? 0.f : 1.f;
    }

    void triggerMono (int note, float vel)
    {
        if ((int) P[P_POLY] == 2)
        {
            trigger (voices[0], note, vel, 0.f);
            for (int i = 1; i < kVoices; ++i)
                if (voices[i].gateOn) release (voices[i]);
        }
        else
        {
            for (int i = 0; i < kVoices; ++i)
                trigger (voices[i], note, vel, ((i - 3.5f) / 3.5f) * P[P_UNIDET] * 40.f);
        }
        lastPitch = (float) note;
    }

    void noteOn (int n, float vel)
    {
        if ((int) P[P_POLY] == 0)
        {
            Voice* tgt = nullptr;
            for (auto& v : voices) if (v.active && v.gateOn && v.note == n) { tgt = &v; break; }
            if (! tgt) for (auto& v : voices) if (! v.active) { tgt = &v; break; }
            if (! tgt)
            {
                uint32_t best = UINT32_MAX;
                for (auto& v : voices) if (! v.gateOn && v.age < best) { best = v.age; tgt = &v; }
                if (! tgt)
                    for (auto& v : voices) if (v.age < best) { best = v.age; tgt = &v; }
            }
            trigger (*tgt, n, vel, 0.f);
            lastPitch = (float) n;
        }
        else
        {
            held.erase (std::remove_if (held.begin(), held.end(), [n] (const std::pair<int, float>& h) { return h.first == n; }), held.end());
            held.push_back ({ n, vel });
            triggerMono (n, vel);
        }
    }

    void noteOff (int n)
    {
        if ((int) P[P_POLY] == 0)
        {
            for (auto& v : voices)
                if (v.active && v.gateOn && v.note == n)
                {
                    if (sustainDown) v.pendingRelease = true; else release (v);
                }
        }
        else
        {
            held.erase (std::remove_if (held.begin(), held.end(), [n] (const std::pair<int, float>& h) { return h.first == n; }), held.end());
            if (held.empty())
            {
                for (auto& v : voices)
                    if (v.gateOn) { if (sustainDown) v.pendingRelease = true; else release (v); }
            }
            else
                triggerMono (held.back().first, held.back().second);
        }
    }

    void setSustain (bool d)
    {
        sustainDown = d;
        if (! d)
            for (auto& v : voices)
                if (v.pendingRelease) release (v);
    }

    void renderChunk (float* L, float* R, int m)
    {
        // --- LFO global
        const float lfoInc = P[P_LFORATE] / sr;
        const int lw = (int) P[P_LFOWAVE];
        for (int i = 0; i < m; ++i)
        {
            lfoPhase += lfoInc;
            if (lfoPhase >= 1.f) { lfoPhase -= 1.f; shValue = rnd() * 2.f - 1.f; }
            float x;
            switch (lw)
            {
                case 0: x = 1.f - 4.f * std::fabs (lfoPhase - 0.5f); break;
                case 1: x = 1.f - 2.f * lfoPhase; break;
                case 2: x = lfoPhase < 0.5f ? 1.f : -1.f; break;
                default: x = shValue; break;
            }
            lfoBuf[(size_t) i] = x;
        }
        std::fill (L, L + m, 0.f);
        std::fill (R, R + m, 0.f);

        // --- paramètres constants sur le bloc
        const float glideT = P[P_GLIDE];
        const float glideCoef = glideT > 0.001f ? 1.f - std::exp (-1.f / (glideT * sr)) : 1.f;
        const float lfoDelay = P[P_LFODELAY];
        const float lfoGainInc = lfoDelay > 0.001f ? 1.f / (lfoDelay * sr) : 1.f;
        const float pd = std::min (1.f, std::max (0.f, P[P_LFOPITCH] + modWheel));
        const float pitchDepth = pd * pd * 4.f;
        const float bendSemis = bend * P[P_BENDRANGE];
        const EnvSet fenv { P[P_FA], P[P_FD], P[P_FS], P[P_FR] };
        const EnvSet aenv { P[P_AA], P[P_AD], P[P_AS], P[P_AR] };
        const int w1 = (int) P[P_O1WAVE], w2 = (int) P[P_O2WAVE];
        const float oct1 = (P[P_O1RANGE] - 1.f) * 12.f;
        const float oct2 = (P[P_O2RANGE] - 1.f) * 12.f + P[P_O2SEMI] + P[P_O2FINE] / 100.f;
        const bool sync = P[P_SYNC] > 0.5f;
        const float xmod = P[P_XMOD], pw = P[P_PW], pwm = P[P_PWM], mix = P[P_MIX], noiseLvl = P[P_NOISE];
        const float hg = std::tan (kPi * std::min (P[P_HPF], 0.45f * sr) / sr);
        const float hpG = hg / (1.f + hg);
        const float cutoff = P[P_CUTOFF], res = P[P_RES];
        const bool slope24 = (int) P[P_SLOPE] == 1;
        const float kRes = std::min (res, 0.98f) * 4.f;
        const float svfR = 1.f - 0.97f * res;
        const float envAmt = P[P_ENVAMT], keyFol = P[P_KEYFOL], lfoFilt = P[P_LFOFILT];
        const float velSens = P[P_VELSENS];
        const float voiceGain = (int) P[P_POLY] == 1 ? 0.30f : 0.42f;
        const float spread = P[P_SPREAD];

        for (int vi = 0; vi < kVoices; ++vi)
        {
            Voice& v = voices[(size_t) vi];
            if (! v.active) continue;

            const float panPos = 0.5f + 0.5f * spread * (((vi * 5) % 8) / 3.5f - 1.f);
            const float gl = std::cos (panPos * kPi * 0.5f) * 1.41421f;
            const float gr = std::sin (panPos * kPi * 0.5f) * 1.41421f;
            const float velGain = (1.f - velSens) + velSens * v.vel;
            const float detSemis = v.detune / 100.f;

            for (int i = 0; i < m; ++i)
            {
                v.pitch += (v.target - v.pitch) * glideCoef;
                v.lfoGain = std::min (1.f, v.lfoGain + lfoGainInc);
                const float lfo = lfoBuf[(size_t) i] * v.lfoGain;
                const float semis = v.pitch + detSemis + bendSemis + lfo * pitchDepth;

                const float dt1 = std::min (0.45f, 440.f * std::exp2 ((semis + oct1 - 69.f) / 12.f) / sr);
                const float dt2 = std::min (0.45f, 440.f * std::exp2 ((semis + oct2 - 69.f) / 12.f) / sr);
                const float pwE = std::min (0.95f, std::max (0.05f, pw + pwm * lfo * 0.45f));
                const float dt1m = xmod > 0.f ? std::min (0.45f, dt1 * std::exp2 (xmod * v.o2prev * 2.f)) : dt1;

                const float s1 = v.o1.gen (w1, dt1m, pwE);
                if (sync && v.o1.wrapped) v.o2.phase = std::min (0.999f, v.o1.phase * (dt2 / dt1m));
                const float s2 = v.o2.gen (w2, dt2, pwE);
                v.o2prev = s2;

                float sig = (s1 * (1.f - mix) + s2 * mix) * 1.4f;
                if (noiseLvl > 0.f) sig += (rnd() * 2.f - 1.f) * noiseLvl * 0.8f;

                // HPF 6 dB
                {
                    const float vv = (sig - v.hpS) * hpG;
                    const float lp = vv + v.hpS;
                    v.hpS = lp + vv;
                    sig -= lp;
                }

                const float fe = v.fe.tick (fenv, sr);
                const float ae = v.ae.tick (aenv, sr);

                float octs = envAmt * 6.f * fe + lfoFilt * lfo * 2.f + keyFol * (v.pitch - 60.f) / 12.f;
                octs = std::min (8.f, std::max (-8.f, octs));
                float fc = std::min (cutoff * std::exp2 (octs), 0.45f * sr);
                fc = std::max (fc, 20.f);
                const float g = std::tan (kPi * fc / sr);
                const float y = slope24 ? v.lad.process (sig, g, kRes) * (1.f + 0.5f * res)
                                        : v.svf.lp (sig, g, svfR);

                const float out = y * ae * velGain * voiceGain;
                L[i] += out * gl;
                R[i] += out * gr;

                if (! v.gateOn && v.ae.st == Envelope::Idle) { v.active = false; break; }
            }
        }

        const float master = P[P_MASTER];
        for (int i = 0; i < m; ++i)
        {
            L[i] = std::tanh (L[i]) * master;
            R[i] = std::tanh (R[i]) * master;
        }
    }

    Params P = Params::defaults();
    float sr = 44100.f;
    Voice voices[kVoices];
    std::vector<std::pair<int, float>> held;
    std::vector<float> lfoBuf;
    bool sustainDown = false;
    float lastPitch = -1.f, lfoPhase = 0.f, shValue = 0.f, bend = 0.f, modWheel = 0.f;
    uint32_t ageCounter = 0, rng = 2463534242u;
};
} // namespace jv

